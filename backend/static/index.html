<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARPE — Regional Itajaí-SC</title>
  <style>
    :root{
      --bg:#ececec;
      --card:#f7f7f7;
      --card-2:#ffffff;
      --text:#171717;
      --muted:#8a8a8a;
      --line:#d9d9d9;
      --danger:#d96b5f;
      --danger-bg:#fff1ef;
      --black:#0f0f10;
      --shadow:0 8px 24px rgba(0,0,0,.05);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Georgia,serif}
    body{min-height:100vh}

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:36px 16px;
    }

    .container{
      width:100%;
      max-width:540px;
      text-align:center;
      position:relative;
    }

    .brand{
      margin:18px 0 28px;
    }

    .brand .ccb{
      font-size:62px;
      font-weight:700;
      line-height:1;
      margin-bottom:18px;
    }

    .brand .title{
      font-size:23px;
      font-weight:700;
      line-height:1.35;
    }

    .splash{
      display:none;
      min-height:78vh;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }

    .splash.active{display:flex}

    .splash-card{
      width:100%;
      max-width:420px;
      padding:34px 24px 38px;
      border:1px solid #d8d8d8;
      border-radius:30px;
      background:var(--card);
      box-shadow:var(--shadow);
    }

    .splash-logo{
      font-size:60px;
      font-weight:700;
      line-height:1;
      margin-bottom:18px;
    }

    .splash-title{
      font-size:22px;
      font-weight:700;
      line-height:1.4;
      margin-bottom:18px;
    }

    .splash-line{
      width:110px;
      height:4px;
      border-radius:999px;
      background:#111;
      margin:18px auto 18px;
      opacity:.9;
      animation:pulseLine 1.3s ease-in-out infinite;
    }

    .splash-verse{
      color:#737373;
      font-style:italic;
      line-height:1.9;
      font-size:15px;
    }

    .splash-ref{
      display:block;
      margin-top:8px;
      font-style:normal;
      letter-spacing:3px;
      font-weight:700;
      color:#9b9b9b;
    }

    @keyframes pulseLine{
      0%{transform:scaleX(.75);opacity:.45}
      50%{transform:scaleX(1);opacity:1}
      100%{transform:scaleX(.75);opacity:.45}
    }

    .card{
      background:var(--card);
      border:1px solid #d8d8d8;
      border-radius:28px 28px 0 0;
      overflow:hidden;
      text-align:left;
      box-shadow:var(--shadow);
    }

    .tabs{
      display:flex;
      padding:24px 28px 0;
      gap:16px;
    }

    .tab{
      flex:1;
      text-align:center;
      padding:14px 0 16px;
      border:none;
      background:none;
      font-size:18px;
      font-weight:700;
      color:#9d9d9d;
      cursor:pointer;
      border-bottom:4px solid transparent;
    }

    .tab.active{
      color:var(--text);
      border-bottom-color:var(--black);
    }

    .panel{
      display:none;
      padding:24px 28px 30px;
      border-top:1px solid var(--line);
    }

    .panel.active{display:block}

    .alert{
      display:none;
      margin-bottom:18px;
      padding:16px 18px;
      border-radius:12px;
      border:1px solid #efb3ac;
      background:var(--danger-bg);
      color:var(--danger);
      font-size:16px;
      line-height:1.4;
    }

    .alert.show{display:block}

    .field{margin-bottom:18px}

    .label{
      display:block;
      margin-bottom:8px;
      font-size:13px;
      letter-spacing:3px;
      text-transform:uppercase;
      font-weight:700;
      color:#444;
    }

    .input,
    .select{
      width:100%;
      height:64px;
      border-radius:14px;
      border:1px solid #b8b8b8;
      background:#efefef;
      padding:0 18px;
      font-size:18px;
      color:#191919;
      outline:none;
    }

    .input:focus,
    .select:focus{
      border-color:#8d8d8d;
      background:#f4f4f4;
    }

    .file{
      width:100%;
      padding:16px;
      border-radius:14px;
      border:1px solid #b8b8b8;
      background:#efefef;
      font-size:16px;
    }

    .file-preview{
      display:none;
      width:110px;
      height:110px;
      object-fit:cover;
      border-radius:18px;
      margin-top:12px;
      border:1px solid #d0d0d0;
      background:#f0f0f0;
    }

    .btn{
      width:100%;
      height:66px;
      border:none;
      border-radius:14px;
      background:var(--black);
      color:#fff;
      font-size:18px;
      font-weight:700;
      letter-spacing:2px;
      cursor:pointer;
      margin-top:8px;
    }

    .btn:disabled{opacity:.7;cursor:not-allowed}

    .links{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin-top:20px;
      font-size:16px;
    }

    .links a{
      color:#5a5a5a;
      text-decoration:underline;
      cursor:pointer;
    }

    .footer{
      padding:28px 20px 34px;
      border-top:1px solid var(--line);
      text-align:center;
      color:#737373;
      font-style:italic;
      line-height:1.9;
      font-size:15px;
    }

    .footer .ref{
      display:block;
      margin-top:8px;
      font-style:normal;
      letter-spacing:3px;
      font-weight:700;
      color:#9b9b9b;
    }

    .screen-home,
    .screen-section{
      display:none;
      text-align:left;
      background:var(--card);
      border:1px solid #d8d8d8;
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
    }

    .screen-home.active,
    .screen-section.active{display:block}

    .welcome{
      font-size:16px;
      color:#8c8c8c;
      margin-bottom:8px;
    }

    .name{
      font-size:40px;
      font-weight:700;
      margin-bottom:8px;
    }

    .meta{
      font-size:18px;
      color:#3d3d3d;
      margin-bottom:20px;
    }

    .meta span{
      display:inline-block;
      padding:6px 12px;
      background:#efefef;
      border-radius:999px;
      border:1px solid #ddd;
    }

    .home-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:20px;
    }

    .action{
      padding:18px;
      border-radius:18px;
      border:1px solid #d7d7d7;
      background:#fff;
      min-height:108px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      cursor:pointer;
      text-align:left;
      box-shadow:0 4px 12px rgba(0,0,0,.03);
    }

    .action.dark{
      background:#141414;
      color:#fff;
    }

    .action h4,.action p{pointer-events:none}
    .action h4{margin:0 0 4px;font-size:16px}
    .action p{margin:0;color:inherit;opacity:.72;font-size:14px}

    .topbar{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
      align-items:center;
    }

    .logout{
      border:none;
      background:none;
      color:#666;
      text-decoration:underline;
      cursor:pointer;
      font-size:15px;
    }

    .section-content{
      margin-top:10px;
      line-height:1.8;
      font-size:17px;
      color:#303030;
    }

    .section-title{
      font-size:32px;
      font-weight:700;
      margin:0 0 8px;
    }

    .section-card{
      background:#fff;
      border:1px solid #ddd;
      border-radius:16px;
      padding:18px;
      margin-top:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.03);
    }

    .section-label{
      font-size:12px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:#888;
      margin-bottom:6px;
      font-weight:700;
    }

    .section-value{
      font-size:18px;
      color:#171717;
      word-break:break-word;
    }

    .cred-layout{
      display:grid;
      gap:16px;
    }

    .cred-head{
      display:flex;
      gap:16px;
      align-items:center;
      margin-bottom:8px;
    }

    .avatar-photo{
      width:92px;
      height:92px;
      border-radius:18px;
      object-fit:cover;
      background:#ebebeb;
      border:1px solid #d7d7d7;
      flex:0 0 auto;
    }

    .avatar-fallback{
      width:92px;
      height:92px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#141414;
      color:#fff;
      font-size:32px;
      font-weight:700;
      border:1px solid #141414;
      flex:0 0 auto;
    }

    .cred-name{
      font-size:24px;
      line-height:1.25;
      font-weight:700;
      margin-bottom:6px;
    }

    .cred-tag{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#efefef;
      border:1px solid #ddd;
      font-size:12px;
      letter-spacing:1px;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .cred-sub{
      color:#555;
      font-size:15px;
      line-height:1.45;
    }

    .cred-grid{
      display:grid;
      gap:12px;
    }

    .cred-mini{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .qr-box{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:140px;
      background:#fff;
      border:1px solid #ddd;
      border-radius:18px;
      padding:18px;
      margin-top:4px;
    }

    .profile-hero{
      display:flex;
      align-items:center;
      gap:16px;
      margin-top:8px;
      margin-bottom:6px;
    }

    .profile-name{
      font-size:28px;
      line-height:1.2;
      font-weight:700;
      margin-bottom:6px;
    }

    .profile-badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#efefef;
      border:1px solid #ddd;
      font-size:12px;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .pres-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px;
      border:1px solid #ddd;
      border-radius:16px;
      background:#fff;
      margin-top:12px;
    }

    .pres-icon{
      width:40px;
      height:40px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#141414;
      color:#fff;
      font-weight:700;
      flex:0 0 auto;
    }

    .pres-main{flex:1}
    .pres-title{font-size:17px;font-weight:700}
    .pres-sub{font-size:14px;color:#666}
    .pres-status{font-size:13px;color:#666;text-transform:uppercase;letter-spacing:1px}

    .empty{
      padding:22px 18px;
      border-radius:16px;
      background:#fff;
      border:1px solid #ddd;
      text-align:center;
      color:#666;
      margin-top:14px;
    }

    .ensin-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 2px 10px;
  margin-bottom:14px;
  scrollbar-width:none;
}
.ensin-tabs::-webkit-scrollbar{display:none}

.ensin-tab{
  border:1px solid #d8d8d8;
  border-radius:999px;
  padding:8px 14px;
  background:#f3f3f3;
  color:#555;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s ease;
}

.ensin-tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.ensin-card{
  background:#fff;
  border:1px solid #d9d9d9;
  border-radius:24px;
  padding:26px 24px 22px;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.ensin-tag{
  display:inline-block;
  padding:10px 18px;
  border-radius:999px;
  background:#f1f1f1;
  border:1px solid #dedede;
  color:#555;
  font-size:14px;
  margin-bottom:18px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.ensin-question{
  font-size:22px;
  font-weight:700;
  line-height:1.28;
  margin-bottom:18px;
  color:#333;
}

.ensin-answer{
  font-size:17px;
  line-height:1.7;
  color:#4a4a4a;
  min-height:170px;
}

.ensin-progress{
  margin-top:18px;
  height:10px;
  border-radius:999px;
  background:#ececec;
  overflow:hidden;
}

.ensin-bar{
  width:0%;
  height:100%;
  background:#111;
  border-radius:999px;
}

.ensin-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:22px;
}

.ensin-counter{
  font-size:15px;
  color:#555;
  min-width:80px;
  text-align:center;
}

.nav-btn{
  min-width:102px;
  height:48px;
  border:none;
  border-radius:16px;
  padding:0 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

#btn-anterior{
  background:#d9d9d9;
  color:#fff;
}

#btn-proximo{
  background:#111;
  color:#fff;
}

.nav-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}
    @media (max-width:560px){
      .wrap{padding:24px 8px}
      .brand .ccb{font-size:52px}
      .brand .title{font-size:18px}
      .panel{padding:20px 20px 26px}
      .tabs{padding:20px 20px 0}
      .input,.select{height:58px;font-size:17px}
      .btn{height:62px}
      .name{font-size:34px}
      .section-title{font-size:28px}
      .home-actions{grid-template-columns:1fr 1fr}
      .cred-head,.profile-hero{align-items:flex-start}
      .cred-name{font-size:21px}
      .profile-name{font-size:24px}
      .ensin-question{font-size:19px}
      .ensin-answer{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">

      <div id="screen-splash" class="splash active">
        <div class="splash-card">
          <div class="splash-logo">CCB</div>
          <div class="splash-title">DARPE — REGIONAL<br>ITAJAÍ -SC</div>
          <div class="splash-line"></div>
          <div class="splash-verse">
            “E disse-lhes: Ide por todo o mundo,<br>
            pregai o evangelho a toda criatura.”
            <span class="splash-ref">MARCOS 16:15</span>
          </div>
        </div>
      </div>

      <div id="screen-auth" class="card" style="display:none;">
        <div class="tabs">
          <button id="tab-login" class="tab active" type="button">ENTRAR</button>
          <button id="tab-cadastro" class="tab" type="button">CADASTRAR</button>
        </div>

        <div id="panel-login" class="panel active">
          <div id="login-err" class="alert"></div>

          <div class="field">
            <label class="label" for="l-wpp">WhatsApp</label>
            <input id="l-wpp" class="input" type="text" />
          </div>

          <div class="field">
            <label class="label" for="l-pw">Senha</label>
            <input id="l-pw" class="input" type="password" />
          </div>

          <button id="btn-login" class="btn" type="button">ENTRAR</button>

          <div class="links">
            <a id="go-cadastro">Não possuo cadastro</a>
            <a>Esqueci a senha</a>
          </div>
        </div>

        <div id="panel-cadastro" class="panel">
          <div id="cad-err" class="alert"></div>

          <div class="field">
            <label class="label" for="c-nome">Nome completo</label>
            <input id="c-nome" class="input" type="text" />
          </div>

          <div class="field">
            <label class="label" for="c-comum">Comum / Congregação</label>
            <input id="c-comum" class="input" type="text" />
          </div>

          <div class="field">
            <label class="label" for="c-wpp">WhatsApp</label>
            <input id="c-wpp" class="input" type="text" />
          </div>

          <div class="field">
            <label class="label" for="c-cargo">Cargo / Função</label>
            <select id="c-cargo" class="select">
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="field">
            <label class="label" for="c-foto">Foto</label>
            <input id="c-foto" class="file" type="file" accept="image/*" />
            <img id="c-foto-preview" class="file-preview" alt="Prévia da foto" />
            <div class="section-label" style="margin-top:12px;">Envie uma foto para o cadastro.</div>
          </div>

          <div class="field">
            <label class="label" for="c-pw">Senha</label>
            <input id="c-pw" class="input" type="password" />
          </div>

          <button id="btn-cad" class="btn" type="button">CADASTRAR</button>
        </div>

        <div class="footer">
          “E disse-lhes: Ide por todo o mundo,<br>
          pregai o evangelho a toda criatura.”
          <span class="ref">MARCOS 16:15</span>
        </div>
      </div>

      <div id="screen-home" class="screen-home">
        <div class="topbar">
          <div></div>
          <button id="btn-logout" class="logout" type="button">Sair</button>
        </div>

        <div class="welcome">Bem-vindo,</div>
        <div id="home-name" class="name">Irmão</div>
        <div class="meta">
          <span id="home-wpp">—</span>
        </div>

        <div class="home-actions">
          <button class="action dark" type="button" onclick="openSection('credencial')">
            <h4>Credencial</h4>
            <p>Carteirinha digital</p>
          </button>

          <button class="action" type="button" onclick="openSection('presencas')">
            <h4>Presenças</h4>
            <p>Histórico</p>
          </button>

          <button class="action" type="button" onclick="openSection('perfil')">
            <h4>Perfil</h4>
            <p>Meus dados</p>
          </button>

          <button class="action" type="button" onclick="openSection('ensinamentos')">
            <h4>Ensinamentos</h4>
            <p>DARPE</p>
          </button>
        </div>
      </div>

      <div id="screen-section" class="screen-section">
        <div class="topbar">
          <button class="logout" type="button" onclick="backHome()">Voltar</button>
          <button class="logout" type="button" onclick="logout()">Sair</button>
        </div>

        <div id="section-title" class="section-title">Seção</div>
        <div id="section-content" class="section-content"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const API = "/api";
    const FALLBACK_CARGOS = [
      "COLABORADOR",
      "ATENDENTE",
      "SECRETÁRIO(A) LOCAL",
      "SECRETÁRIO(A) REGIONAL",
      "ANCIÃO COORDENADOR"
    ];

    const ensinamentos = [
      {
        categoria: "Irmãos",
        pergunta: "O colaborador pode agir fora da orientação recebida?",
        resposta: "Não. Deve sempre agir em obediência às orientações recebidas."
      },
      {
        categoria: "Irmãs e Trajes",
        pergunta: "Qual é a orientação para as irmãs do grupo sobre o modelo de véu a ser usado nas reuniões?",
        resposta: "Devem usar véus simples, sem rendas largas que chamem a atenção."
      },
      {
        categoria: "Irmãs e Trajes",
        pergunta: "Pode haver participação de irmãs em instituições masculinas?",
        resposta: "Não deve haver participação de irmãs nessas instituições em hipótese alguma."
      },
      {
        categoria: "Música",
        pergunta: "Qual deve ser o comportamento dos músicos em relação aos seus instrumentos perante os ouvintes?",
        resposta: "Os músicos nunca devem oferecer seus instrumentos aos ouvintes para evitar constrangimentos."
      },
      {
        categoria: "Base Legal",
        pergunta: "Qual artigo da Constituição Federal de 1988 assegura a assistência religiosa em entidades de internação?",
        resposta: "Artigo 5º, inciso VII."
      },
      {
        categoria: "Base Legal",
        pergunta: "Segundo a Lei de Execução Penal, a participação do preso em atividades religiosas é obrigatória?",
        resposta: "Não. Nenhum preso ou internado poderá ser obrigado a participar de atividade religiosa."
      },
      {
        categoria: "Base Legal",
        pergunta: "Qual lei brasileira dispõe sobre a prestação de assistência religiosa em hospitais públicos e privados?",
        resposta: "Lei nº 9.982, de 14 de julho de 2000."
      },
      {
        categoria: "Situações Especiais",
        pergunta: "O que deve ser feito se um colaborador for aposentado por invalidez pelo INSS?",
        resposta: "Ele não deve exercer atividade voluntária sob o risco de perda do seu benefício."
      }
    ];

    let user = {};
    let token = "";
    let qrDone = false;
    let categoriaAtual = "Todas";
    let listaFiltrada = [...ensinamentos];
    let indiceAtual = 0;
    let splashLiberado = false;

    function showAlert(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg || "";
      el.classList.add("show");
    }

    function hideAlert(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = "";
      el.classList.remove("show");
    }

    function hideSplash() {
      const splash = document.getElementById("screen-splash");

        splash.style.display = "none";
      }
      splashLiberado = true;

    function showAuth(tab = "login") {
      hideSplash();
      document.getElementById("screen-auth").style.display = "block";
      document.getElementById("screen-home").classList.remove("active");
      document.getElementById("screen-section").classList.remove("active");
      document.getElementById("screen-section").style.display = "none";

      const tabCadastro = document.getElementById("tab-cadastro");
      const panelLogin = document.getElementById("panel-login");
      const panelCadastro = document.getElementById("panel-cadastro");

      if (tab === "login") {
        tabLogin.classList.add("active");
        tabCadastro.classList.remove("active");
        panelLogin.classList.add("active");
        panelCadastro.classList.remove("active");
      } else {
        tabCadastro.classList.add("active");
        tabLogin.classList.remove("active");
        panelCadastro.classList.add("active");
        panelLogin.classList.remove("active");

    function showHome() {
      hideSplash();
      document.getElementById("screen-auth").style.display = "none";
      document.getElementById("screen-section").classList.remove("active");
      document.getElementById("screen-section").style.display = "none";
      document.getElementById("screen-home").classList.add("active");

    function escapeHtml(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function getNome() {
      return user?.nome_completo || user?.nome || "Irmão";
    }

    function getWhatsapp() {
      return user?.whatsapp || user?.WhatsApp || "—";
    }

    function getCargo() {
      return user?.cargo_funcao_ministerio || user?.cargo || user?.funcao || "—";
    }

    function getComum() {
      return user?.comum_congregacao || user?.comum || user?.congregacao || "—";
    }

    function getFoto() {
      return user?.foto_url || user?.foto || user?.imagem || "";
    }

    function getQrValue() {
      return user?.qr_token || user?.id || user?._id || user?.whatsapp || "DARPE";
    }

      const inicial = (nome || "I").trim().charAt(0).toUpperCase() || "I";
      if (photo) {
        return `<img id="${prefix}-foto" class="avatar-photo" src="${escapeHtml(photo)}" alt="Foto">`;
      }
      return `<div class="avatar-fallback">${escapeHtml(inicial)}</div>`;
    }

if (section === "ensinamentos") {

    function backHome() {
      document.getElementById("screen-section").style.display = "none";
      document.getElementById("screen-section").classList.remove("active");
      showHome();
    }

    function genQR() {
      const el = document.getElementById("cred-qr");
      if (!el || qrDone) return;

      const valor = String(getQrValue());
      el.innerHTML = "";

      try {
        if (typeof QRCode === "undefined") {
          el.innerHTML = `<div class="empty">Biblioteca do QR Code não carregou.</div>`;
          return;
        }

        new QRCode(el, {
          text: valor,
          width: 150,
          height: 150,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        qrDone = true;
      } catch (e) {
        console.error("Erro ao gerar QR:", e);
        el.innerHTML = `<div class="empty">Não foi possível gerar o QR Code.</div>`;
      }
    }

    async function loadCargos() {
      const sel = document.getElementById("c-cargo");
      if (!sel) return;

      try {
        const r = await fetch(`${API}/colaboradores/cargos`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const d = await r.json();
        const cargos = Array.isArray(d.cargos) && d.cargos.length ? d.cargos : FALLBACK_CARGOS;

        sel.innerHTML = '<option value="">Selecione...</option>';
        cargos.forEach(c => {
          const o = document.createElement("option");
          o.value = c;
          o.textContent = c;
          sel.appendChild(o);
        });
      } catch (e) {
        console.error("Erro ao carregar cargos:", e);
        sel.innerHTML = '<option value="">Selecione...</option>';
        FALLBACK_CARGOS.forEach(c => {
          const o = document.createElement("option");
          o.value = c;
          o.textContent = c;
          sel.appendChild(o);
        });
      }
    }

    function configurarPreviewFoto() {
      const input = document.getElementById("c-foto");
      const preview = document.getElementById("c-foto-preview");
      if (!input || !preview) return;

      input.addEventListener("change", () => {
        const file = input.files && input.files[0];
        if (!file) {
          preview.src = "";
          preview.style.display = "none";
          return;
        }

        if (!file.type.startsWith("image/")) {
          preview.src = "";
          preview.style.display = "none";
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      });
    }

    function formatDateBR(v) {
      if (!v) return "—";
      try {
        return new Date(v).toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        });
      } catch {
        return "—";
      }
    }

    async function loadPres() {
      const el = document.getElementById("pres-lista");
      if (!el) return;

      if (!user?.id && !user?._id) {
        el.innerHTML = '<div class="empty">Usuário sem identificação para buscar presenças.</div>';
        return;
      }

      el.innerHTML = '<div class="empty">Carregando presenças...</div>';

      const uid = user.id || user._id;
      const headers = token ? { "Authorization": `Bearer ${token}` } : {};

      const rotas = [
        `${API}/presencas-colaboradores/colaborador/${uid}`,
        `${API}/presencas/colaborador/${uid}`,
        `${API}/presencas/minhas`,
        `${API}/attendance-results/minhas`,
        `${API}/attendance-results`
      ];

      let dados = null;

      for (const rota of rotas) {
        try {
          const r = await fetch(rota, { headers });
          if (r.status === 404) continue;
          if (!r.ok) continue;
          dados = await r.json();
          break;
        } catch (e) {
          console.error("Falha rota presença:", rota, e);
        }
      }

      let lista = [];
      if (Array.isArray(dados)) lista = dados;
      else if (Array.isArray(dados?.presencas)) lista = dados.presencas;
      else if (Array.isArray(dados?.data)) lista = dados.data;
      else if (Array.isArray(dados?.resultados)) lista = dados.resultados;

      if (!lista.length) {
        el.innerHTML = '<div class="empty">Nenhuma presença registrada ainda.</div>';
        return;
      }

      el.innerHTML = lista.map((item, idx) => {
        const titulo = item?.local || item?.nome_local || item?.reuniao || item?.titulo || "Reunião DARPE";
        const data = formatDateBR(item?.data_checkin || item?.criado_em || item?.data || item?.timestamp);
        const status = item?.status || "confirmado";
        return `
          <div class="pres-item">
            <div class="pres-icon">✓</div>
            <div class="pres-main">
              <div class="pres-title">${escapeHtml(titulo)}</div>
              <div class="pres-sub">${escapeHtml(data)}</div>
            </div>
            <div class="pres-status">${escapeHtml(String(status))}</div>
          </div>
        `;
      }).join("");
    }

    function atualizarTabs(tabClicada) {
      document.querySelectorAll(".ensin-tab").forEach(tab => tab.classList.remove("active"));
      if (tabClicada) tabClicada.classList.add("active");
    }

    function filtrarCategoria(categoria, elemento = null) {
      categoriaAtual = categoria;
      listaFiltrada = categoria === "Todas"
        ? [...ensinamentos]
        : ensinamentos.filter(item => item.categoria === categoria);
      indiceAtual = 0;
      atualizarTabs(elemento);
      renderEnsinamento();
    }

    function renderEnsinamento() {
      const perguntaEl = document.getElementById("ensin-question");
      const respostaEl = document.getElementById("ensin-answer");
      const contadorEl = document.getElementById("ensin-counter");
      const tagEl = document.getElementById("ensin-tag");
      const barraEl = document.getElementById("ensin-bar");
      const btnAnterior = document.getElementById("btn-anterior");
      const btnProximo = document.getElementById("btn-proximo");

      if (!perguntaEl || !respostaEl || !contadorEl || !tagEl || !barraEl || !btnAnterior || !btnProximo) return;

      if (!listaFiltrada.length) {
        perguntaEl.innerText = "Nenhum ensinamento encontrado.";
        respostaEl.innerText = "Não há conteúdo disponível nesta categoria.";
        contadorEl.innerText = "0 de 0";
        tagEl.innerText = categoriaAtual;
        barraEl.style.width = "0%";
        btnAnterior.disabled = true;
        btnProximo.disabled = true;
        return;
      }

      const item = listaFiltrada[indiceAtual];
      perguntaEl.innerText = item.pergunta;
      respostaEl.innerText = item.resposta;
      contadorEl.innerText = `${indiceAtual + 1} de ${listaFiltrada.length}`;
      tagEl.innerText = item.categoria;
      barraEl.style.width = `${((indiceAtual + 1) / listaFiltrada.length) * 100}%`;
      btnAnterior.disabled = indiceAtual === 0;
      btnProximo.disabled = indiceAtual === listaFiltrada.length - 1;
    }

    function proximoEnsinamento() {
      if (indiceAtual < listaFiltrada.length - 1) {
        indiceAtual++;
        renderEnsinamento();
      }
    }

    function anteriorEnsinamento() {
      if (indiceAtual > 0) {
        indiceAtual--;
        renderEnsinamento();
      }
    }

    async function doCadastro() {
      hideAlert("cad-err");

      const nome = document.getElementById("c-nome").value.trim();
      const comum = document.getElementById("c-comum").value.trim();
      const whatsapp = document.getElementById("c-wpp").value.trim();
      const cargo = document.getElementById("c-cargo").value;
      const senha = document.getElementById("c-pw").value.trim();
      const foto = document.getElementById("c-foto").files[0];

      if (!nome || !comum || !whatsapp || !cargo || !senha) {
        showAlert("cad-err", "Preencha todos os campos.");
        return;
      }

      if (!foto) {
        showAlert("cad-err", "Foto é obrigatória.");
        return;
      }

      const btn = document.getElementById("btn-cad");
      btn.disabled = true;
      btn.textContent = "ENVIANDO...";

      try {
        const fd = new FormData();
        fd.append("nome_completo", nome);
        fd.append("comum_congregacao", comum);
        fd.append("whatsapp", whatsapp);
        fd.append("senha", senha);
        fd.append("cargo_funcao_ministerio", cargo);
        fd.append("foto", foto);

        const r = await fetch(`${API}/colaboradores/cadastro`, {
          method: "POST",
          body: fd
        });

        const d = await r.json();
        if (!r.ok) throw new Error(d.erro || d.detail || "Erro ao cadastrar");

        user = d.colaborador || {};
        token = d.token || "";

        localStorage.setItem("darpe_user", JSON.stringify(user));
        if (token) localStorage.setItem("darpe_token", token);

        showHome();
      } catch (e) {
        showAlert("cad-err", e.message || "Erro ao cadastrar.");
      } finally {
        btn.disabled = false;
        btn.textContent = "CADASTRAR";
      }
    }

    async function doLogin() {
      hideAlert("login-err");

      const w = document.getElementById("l-wpp").value.trim();
      const s = document.getElementById("l-pw").value.trim();

      if (!w || !s) {
        showAlert("login-err", "Preencha todos os campos.");
        return;
      }

      const btn = document.getElementById("btn-login");
      btn.disabled = true;
      btn.textContent = "ENTRANDO...";

      try {
        const r = await fetch(`${API}/colaboradores/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ whatsapp: w, senha: s })
        });

        const d = await r.json();
        if (!r.ok) throw new Error(d.erro || d.detail || "Erro ao entrar");

        user = d.colaborador || {};
        token = d.token || "";

        localStorage.setItem("darpe_user", JSON.stringify(user));
        if (token) localStorage.setItem("darpe_token", token);
        else localStorage.removeItem("darpe_token");

        showHome();
      } catch (e) {
        showAlert("login-err", e.message || "Erro ao entrar");
      } finally {
        btn.disabled = false;
        btn.textContent = "ENTRAR";
      }
    }

    function logout() {
      localStorage.removeItem("darpe_user");
      localStorage.removeItem("darpe_token");
      user = {};
      token = "";
      showAuth("login");
    }

    document.getElementById("tab-login").addEventListener("click", () => showAuth("login"));
    document.getElementById("tab-cadastro").addEventListener("click", () => showAuth("cadastro"));
    document.getElementById("go-cadastro").addEventListener("click", () => showAuth("cadastro"));
    document.getElementById("btn-login").addEventListener("click", doLogin);
    document.getElementById("btn-cad").addEventListener("click", doCadastro);
    document.getElementById("btn-logout").addEventListener("click", logout);

    window.addEventListener("load", async () => {
      try {
        configurarPreviewFoto();
        await loadCargos();

        const u = localStorage.getItem("darpe_user");
        const t = localStorage.getItem("darpe_token");

        if (u) user = JSON.parse(u);
        if (t) token = t || "";

        setTimeout(() => {
          if (user && Object.keys(user).length) showHome();
          else showAuth("login");
        }, 1400);
      } catch (e) {
        console.error(e);
        setTimeout(() => showAuth("login"), 1400);
      }
    });
  </script>
